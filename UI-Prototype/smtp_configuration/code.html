<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SMTP Configuration Protocol - Relayo</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "terminal-bg": "#0a0a0a",
                        "terminal-text": "#e5e5e5",
                        "terminal-accent": "#ccff00","terminal-dim": "#404040",
                        "terminal-input": "#171717",
                    },
                    fontFamily: {
                        "mono": ["'JetBrains Mono'", "monospace"],
                        "sans": ["'Inter'", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0px", 
                        "sm": "0px", 
                        "lg": "0px", 
                        "xl": "0px",
                        "none": "0px"
                    },
                },
            },
        }
    </script>
<style>::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
        }@keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .cursor-blink::after {
            content: '_';
            animation: blink 1s step-end infinite;
            color: #ccff00;
        }.binary-switch-checkbox:checked + .binary-switch-label .switch-indicator {
            transform: translateX(100%);
            border-color: #ccff00;
            background-color: #ccff00;
        }
        .binary-switch-checkbox:checked + .binary-switch-label .switch-indicator::after {
            content: "1";
            color: #000;
        }
        .binary-switch-label .switch-indicator::after {
            content: "0";
            color: #666;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .input-terminal:focus {
            outline: none;
            border-color: #ccff00;
            background-color: #1a1a1a;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-terminal-bg text-terminal-text font-mono antialiased min-h-screen flex flex-col items-center justify-center p-0 md:p-8">
<div class="relative w-full max-w-md bg-terminal-bg h-full min-h-screen md:min-h-[800px] md:h-auto md:border md:border-terminal-dim md:shadow-2xl overflow-hidden flex flex-col">
<header class="flex items-center justify-between px-6 pt-12 pb-6 bg-terminal-bg sticky top-0 z-10 border-b border-terminal-dim">
<button class="flex items-center justify-center w-10 h-10 -ml-2 hover:text-terminal-accent transition-colors text-terminal-text group">
<span class="material-symbols-outlined font-light" style="font-size: 24px;">arrow_back_ios_new</span>
</button>
<h1 class="text-sm font-bold tracking-widest text-terminal-accent uppercase">[CONFIG_PROTOCOL]</h1>
<div class="w-10"></div>
</header>
<main class="flex-1 overflow-y-auto px-6 py-6 space-y-10">
<div class="text-xs text-terminal-dim font-mono leading-relaxed">
<span class="text-gray-600"></span>
</div>
<div class="space-y-8">
<div class="space-y-2 group">
<label class="block text-xs text-terminal-accent opacity-80 mb-1">&gt; SMTP_HOST:</label>
<input class="input-terminal w-full bg-terminal-input border border-terminal-dim text-sm text-terminal-text p-3 font-mono placeholder-gray-700 transition-colors rounded-none" placeholder="smtp.example.com" type="text" value="smtp.gmail.com"/>
</div>
<div class="space-y-2 group">
<label class="block text-xs text-terminal-accent opacity-80 mb-1">&gt; SMTP_PORT:</label>
<input class="input-terminal w-full bg-terminal-input border border-terminal-dim text-sm text-terminal-text p-3 font-mono placeholder-gray-700 transition-colors rounded-none" placeholder="587" type="number" value="587"/>
</div>
<div class="space-y-2 group">
<label class="block text-xs text-terminal-accent opacity-80 mb-1">&gt; USER_IDENTITY:</label>
<input class="input-terminal w-full bg-terminal-input border border-terminal-dim text-sm text-terminal-text p-3 font-mono placeholder-gray-700 transition-colors rounded-none" placeholder="usr@domain.tld" type="email"/>
</div>
<div class="space-y-2 relative group">
<label class="block text-xs text-terminal-accent opacity-80 mb-1">&gt; AUTH_TOKEN:</label>
<div class="relative">
<input class="input-terminal w-full bg-terminal-input border border-terminal-dim text-sm text-terminal-text p-3 font-mono placeholder-gray-700 transition-colors rounded-none pr-10" placeholder="******" type="password"/>
<button class="absolute right-3 top-3 text-terminal-dim hover:text-terminal-accent transition-colors">
<span class="material-symbols-outlined" style="font-size: 18px;">visibility_off</span>
</button>
</div>
</div>
</div>
<div class="pt-6 space-y-6 border-t border-terminal-dim border-dashed">
<div class="flex items-center justify-between group">
<div class="flex flex-col">
<span class="text-sm font-bold text-terminal-text">ENABLE_SSL</span>
<span class="text-[10px] text-gray-500 font-mono">// Secure Sockets Layer</span>
</div>
<label class="relative inline-block w-14 h-8 cursor-pointer">
<input class="sr-only peer binary-switch-checkbox" type="checkbox"/>
<div class="binary-switch-label w-full h-full bg-terminal-input border border-terminal-dim relative">
<div class="switch-indicator absolute top-0.5 left-0.5 w-6 h-6 border border-terminal-dim bg-[#222] transition-transform duration-200 ease-linear"></div>
</div>
</label>
</div>
<div class="flex items-center justify-between group">
<div class="flex flex-col">
<span class="text-sm font-bold text-terminal-text">USE_STARTTLS</span>
<span class="text-[10px] text-gray-500 font-mono">// Upgrade connection</span>
</div>
<label class="relative inline-block w-14 h-8 cursor-pointer">
<input checked="" class="sr-only peer binary-switch-checkbox" type="checkbox"/>
<div class="binary-switch-label w-full h-full bg-terminal-input border border-terminal-dim relative">
<div class="switch-indicator absolute top-0.5 left-0.5 w-6 h-6 border border-terminal-dim bg-[#222] transition-transform duration-200 ease-linear"></div>
</div>
</label>
</div>
</div>
<div class="h-4"></div>
</main>
<footer class="p-6 bg-terminal-bg space-y-4 border-t border-terminal-dim">
<button class="w-full h-12 flex items-center justify-center gap-2 bg-terminal-accent text-black font-mono font-bold hover:bg-white transition-colors duration-200 border border-transparent tracking-tight">
<span class="material-symbols-outlined" style="font-size: 20px;">save</span>
                [ SAVE_CONFIG ]
            </button>
<button class="w-full h-12 flex items-center justify-center gap-2 bg-transparent border border-terminal-dim text-terminal-dim font-mono hover:border-terminal-accent hover:text-terminal-accent transition-colors duration-200">
<span class="material-symbols-outlined" style="font-size: 18px;">terminal</span>
                TEST_SMTP()
            </button>
</footer>
</div>

</body></html>
